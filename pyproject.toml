[project]
name = "fonico-audiolibri"
version = "0.1.0"
description = "Il fonico per chi registra audiolibri"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pedalboard>=0.9", "PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
